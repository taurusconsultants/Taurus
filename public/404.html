<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found — Taurus</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#08090B" />
<!--
  Deliberately SELF-CONTAINED: no stylesheet, no script, no shared assets.

  GitHub Pages serves this file at whatever URL 404'd, so the site's relative
  asset paths (base: './') would resolve against that path and break. Inlining
  everything means the 404 renders correctly from any depth, on either host.
  Keep it that way — do not add a <link> or <script> here.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh;
    display: grid; place-items: center;
    padding: 40px 24px;
    background: #08090B; color: #F4F6F8;
    font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; text-align: center; }
  .mark { width: 44px; height: 44px; color: #C6F24E; margin: 0 auto 30px; display: block; overflow: visible; }
  .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #6B7480; margin-bottom: 20px;
  }
  h1 { font-size: clamp(2rem, 7vw, 3rem); line-height: 1.05; letter-spacing: -0.04em; margin: 0 0 20px; }
  p { color: #A3ABB6; font-size: 16px; margin: 0 0 34px; }
  .btn {
    display: inline-block; padding: 15px 28px; border-radius: 100px;
    background: #C6F24E; color: #0B1400; font-weight: 600; font-size: 15px;
    text-decoration: none; transition: background-color .25s;
  }
  .btn:hover { background: #d4fb63; }
  a:focus-visible { outline: 2px solid #C6F24E; outline-offset: 3px; }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <path d="M5.6 4.8C5.6 11.3 10.3 14.2 16 14.2S26.4 11.3 26.4 4.8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <circle cx="16" cy="22.9" r="6.2" fill="none" stroke="currentColor" stroke-width="3"/>
    </svg>
    <p class="code">Error 404</p>
    <h1>That page doesn't exist.</h1>
    <p>The link may be out of date, or the address slightly off. Everything lives on one page — head back and you'll find it.</p>
    <a class="btn" href="/">Back to the site</a>
  </div>
</body>
</html>
