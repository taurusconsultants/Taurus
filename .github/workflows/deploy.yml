# ============================================================================
#  GitHub Pages — PRODUCTION deploy
# ============================================================================
#
#  taurusconsultancy.com points at GitHub Pages (custom domain set in the
#  repo's Pages settings). This workflow builds the site on every push to
#  main and publishes it. Merging to main IS deploying — there is no other
#  production step.
#
#  Two things to know:
#
#    1. This is an INDEXABLE build. Do not set NOINDEX here. That flag exists
#       for throwaway previews (`npm run build:preview`); it was set on this
#       job while Pages was preview-only, and once the real domain moved
#       here it deindexed the live site. Blog drafts are handled per page
#       instead (`draft: true` in a post's frontmatter → that page alone gets
#       noindex and stays out of the sitemap).
#
#    2. No `base` override is needed. vite.config.js uses base: './', which
#       emits relative asset paths that work at any URL depth. Leave it.
#
#  One-time repo setup: Settings → Pages → Source: "GitHub Actions", and the
#  custom domain entered in the same screen.
# ============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a deploy by hand from the Actions tab

# Least-privilege token, plus what the Pages deploy action requires.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish rather than being
# cancelled, so a half-published site can't be left live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Renders content/blog/ → blog/, validates every post, then bundles.
      # A post that fails frontmatter validation or the wording lint fails
      # this step, and nothing is deployed.
      - name: Build (production — indexable)
        run: npm run build

      # Belt-and-braces: stops GitHub's Jekyll layer touching the output.
      # public/.nojekyll should already put this in dist/, but if that file is
      # ever removed this keeps the deploy working.
      - name: Ensure .nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
